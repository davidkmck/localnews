<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">

    <link rel="manifest" href="/localnews/manifest.json">
    <meta name="theme-color" content="#000000">
    <!-- iOS support -->
    <link rel="apple-touch-icon" href="/localnews/icon-192.png">
    <meta name="apple-mobile-web-app-status-bar" content="#000000">
    
    <title>Local News</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc; --dim: #94a3b8; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; margin: 0; }
        h1 { font-weight: 300; letter-spacing: 2px; color: var(--accent); text-align: center; }
        .feed { max-width: 500px; margin: 0 auto; }
        .article { 
            background: var(--card); padding: 15px; border-radius: 12px; 
            margin-bottom: 15px; border-left: 4px solid var(--accent);
            cursor: pointer; transition: transform 0.2s;
        }
        .article:active { transform: scale(0.98); }
        .title { font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; display: block; }
        .meta { font-size: 0.8rem; color: var(--dim); }
        .loading { text-align: center; color: var(--dim); margin-top: 50px; }
    </style>
</head>
<body>

    <h1>LOCAL PULSE</h1>
    <div id="news-feed" class="feed">
        <div class="loading">Fetching local updates...</div>
    </div>

    <script>


const API_URL = 'feed.xml';
        
async function fetchNews() {
  try {
    const response = await fetch(API_URL);
    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
    
    // Get the raw XML text directly
    const text = await response.text();
    
    // Parse the XML
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(text, "text/xml");
    
    // Extract the news items
    const items = Array.from(xmlDoc.querySelectorAll('item')).slice(0, 10);
    const container = document.getElementById('news-feed');
    container.innerHTML = '';

    items.forEach(item => {
      const title = item.querySelector('title')?.textContent;
      const link = item.querySelector('link')?.textContent;
      const pubDate = item.querySelector('pubDate')?.textContent;
      const author = item.querySelector('author')?.textContent || 'Local News';

      const card = document.createElement('div');
      card.className = 'article';
      card.onclick = () => window.open(link, '_blank');

      const date = new Date(pubDate).toLocaleDateString([], { month: 'short', day: 'numeric' });

      card.innerHTML = `
        <span class="title">${title}</span>
        <span class="meta">${date} • ${author}</span>
      `;
      container.appendChild(card);
    });
  } catch (error) {
    document.getElementById('news-feed').innerHTML = '<div class="loading">Failed to load news.</div>';
    console.error(error);
  }
}

fetchNews();
// Refresh every 30 minutes
setInterval(fetchNews, 1800000);

        if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/localnews/sw.js')
      .then(reg => console.log('Service Worker registered', reg))
      .catch(err => console.error('Service Worker failed', err));
  });
}
     
    </script>
</body>
</html>
